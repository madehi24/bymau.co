<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BY MAU</title>
  <meta name="description" content="BY MAU">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    body {
      font-family: "Inter", sans-serif;
      color: #fff;
      overflow: hidden;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 600px;
      overflow: hidden;
      background: #000;
    }

    .portrait {
      position: absolute;
      z-index: 1;
      right: -2%;
      bottom: -2%;
      height: 92%;
      width: auto;
      object-fit: contain;
      object-position: center bottom;
    }

    /* Overall darkening */
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.25);
      z-index: 2;
      pointer-events: none;
    }

    .content {
      position: absolute;
      z-index: 3;
      left: 8%;
      top: 50%;
      transform: translateY(-50%);
      width: 65%;
    }

    h1 {
      margin: 0;
      max-width: 850px;
      font-size: clamp(3.2rem, 5vw, 5.5rem);
      line-height: 1.02;
      font-weight: 500;
      letter-spacing: -0.055em;
    }

    .categories {
      margin-top: 52px;
      font-size: clamp(0.7rem, 0.95vw, 0.9rem);
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.48);
    }

    .location {
      margin-top: 24px;
      font-size: 0.7rem;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.35);
    }

    .email {
      position: absolute;
      z-index: 3;
      left: 8%;
      bottom: 4%;
      font-size: 0.7rem;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.35);
      text-decoration: none;
    }

    .email:hover {
      color: rgba(255, 255, 255, 0.55);
    }

    @media (max-width: 800px) {
      body {
        overflow: hidden;
      }

      .hero {
        min-height: 100vh;
      }

      .content {
        left: 7%;
        top: 14%;
        transform: none;
        width: 86%;
      }

      h1 {
        font-size: clamp(2.1rem, 7.5vw, 3.5rem);
      }

      .categories {
        margin-top: 30px;
      }

      .location {
        margin-top: 20px;
      }

      .portrait {
        right: -7%;
        bottom: -3%;
        height: 44%;
      }

      .email {
        left: 7%;
        bottom: 4%;
      }
    }
  </style>
</head>

<body>

  <main class="hero">

    <div class="content">

      <h1>
        Hi, I’m Mau.<br>
        I’m building things I find<br>
        interesting.
      </h1>

      <div class="categories">
        Business&nbsp;&nbsp;·&nbsp;&nbsp;Creativity&nbsp;&nbsp;·&nbsp;&nbsp;Design&nbsp;&nbsp;·&nbsp;&nbsp;Technology
      </div>

      <div class="location">
        Colombia&nbsp;&nbsp;·&nbsp;&nbsp;USA
      </div>

    </div>

    <a
      class="email"
      href="mailto:mau@bymau.co"
    >
      mau@bymau.co
    </a>

    <img
      class="portrait"
      src="mau.jpg"
      alt="Mau"
    >

  </main>

</body>
</html>
